name: Clarity synthetic release
on:
  push:
    branches: [main]
    paths: ['clarity/**', '.github/workflows/clarity.yml']
  pull_request:
    paths: ['clarity/**', '.github/workflows/clarity.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clarity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: clarity/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install -r requirements.lock.txt
      - run: PYTHONPATH=backend python -m pytest backend/tests -q
      - run: PYTHONPATH=backend python scripts/test-private-nsdl-connected-demo.py
